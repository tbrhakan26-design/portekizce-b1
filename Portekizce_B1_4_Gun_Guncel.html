&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main class=&quot;wrap&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;span class=&quot;tag&quot;&gt;🇧🇷 Portekizce B1 • 1. Ders&lt;/span&gt;&lt;h1&gt;Um dia cheio de imprevistos&lt;/h1&gt;&lt;div class=&quot;meta&quot;&gt;📅 18 Kasım 2026 · B1 (Orta) · ⏱️ 25–30 dakika · 📝 20 soru&lt;/div&gt;&lt;p&gt;Beklenmedik olaylarla dolu bir gün&lt;/p&gt;&lt;div class=&quot;controls&quot; style=&quot;justify-content:center&quot;&gt;&lt;span class=&quot;score&quot; id=&quot;score&quot;&gt;0/10 çoktan seçmeli doğru&lt;/span&gt;&lt;button class=&quot;btn&quot; id=&quot;sound&quot;&gt;🔊 Ses açık&lt;/button&gt;&lt;/div&gt;&lt;/header&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📖 Texto — Um dia diferente do planejado&lt;/h2&gt;&lt;p&gt;Leia o texto com atenção. Depois, responda às perguntas.&lt;/p&gt;&lt;div class=&quot;reading&quot;&gt;Ontem, Mariana acordou mais cedo do que de costume porque tinha uma entrevista de emprego às nove horas da manhã. Ela estava bastante animada, pois havia esperado por essa oportunidade durante vários meses.

Depois de tomar café da manhã, Mariana saiu de casa às sete e meia. Normalmente, ela leva cerca de quarenta minutos para chegar ao centro da cidade. No entanto, naquele dia, o trânsito estava muito pior do que o habitual.

Enquanto estava no ônibus, Mariana percebeu que tinha esquecido alguns documentos importantes em casa. Por um momento, pensou em voltar, mas decidiu continuar o caminho.

Assim que chegou à empresa, explicou a situação à recepcionista. Felizmente, a funcionária foi muito compreensiva e disse que Mariana poderia enviar os documentos por e-mail mais tarde.

A entrevista durou aproximadamente uma hora. Embora estivesse nervosa no início, Mariana conseguiu responder a todas as perguntas com confiança.

Quando saiu da empresa, recebeu uma mensagem de uma amiga convidando-a para almoçar.

Mariana aceitou o convite porque precisava relaxar depois de uma manhã tão agitada.

No final do dia, percebeu que nem tudo acontece como planejamos, mas isso não significa que as coisas vão dar errado.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📝 Parte 1 — Compreensão de texto&lt;/h2&gt;&lt;p&gt;Okuduğunu anlama · 1–10: &lt;strong&gt;Responda em português, usando frases completas.&lt;/strong&gt;&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Açık uçlu cevapların otomatik puanlanmaz; yazdıkların cihazında saklanır.&lt;/p&gt;&lt;div id=&quot;openqs&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🔤 Parte 2 — Vocabulário&lt;/h2&gt;&lt;p&gt;Kelime bilgisi · 11–15: Escolha a alternativa correta.&lt;/p&gt;&lt;div id=&quot;vocabqs&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🧠 Parte 3 — Gramática&lt;/h2&gt;&lt;p&gt;Dil bilgisi · 16–20: Escolha a alternativa correta.&lt;/p&gt;&lt;div id=&quot;grammarqs&quot;&gt;&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;Seçtiğin şık anında kontrol edilir; sesli uyarı isteğe bağlıdır.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card daily-words-section&quot;&gt;&lt;div class=&quot;word-heading&quot;&gt;&lt;h2&gt;📚 Vocabulário do dia — Günün kelimeleri&lt;/h2&gt;&lt;button aria-label=&quot;Günün kelimelerini resim olarak paylaş&quot; class=&quot;word-share-btn&quot; title=&quot;Kelimeleri resim olarak paylaş&quot; type=&quot;button&quot;&gt;&lt;svg aria-hidden=&quot;true&quot; viewbox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 15.5V2.5m0 0L7.8 6.7M12 2.5l4.2 4.2&quot;&gt;&lt;/path&gt;&lt;path d=&quot;M8 9H6.5A3.5 3.5 0 0 0 3 12.5v7A3.5 3.5 0 0 0 6.5 23h11a3.5 3.5 0 0 0 3.5-3.5v-7A3.5 3.5 0 0 0 17.5 9H16&quot;&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;words-inner-panel&quot;&gt;&lt;table class=&quot;daily-words&quot;&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Imprevisto&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Beklenmedik olay&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;De costume&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Her zamanki gibi&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Oportunidade&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Fırsat&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;No entanto&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Ancak, bununla birlikte&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Perceber&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Fark etmek&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Embora&lt;/b&gt;&lt;/td&gt;&lt;td&gt;-mesine rağmen&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Compreensivo(a)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Anlayışlı&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Confiança&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Özgüven&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Assim que&lt;/b&gt;&lt;/td&gt;&lt;td&gt;-ir -mez&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Agitado(a)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Yoğun, hareketli&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Conseguir&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Başarmak&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Dar errado&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Ters gitmek&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🎯 Bugünün dil bilgisi konusu&lt;/h2&gt;&lt;h3&gt;Embora + pretérito imperfeito do subjuntivo&lt;/h3&gt;&lt;p&gt;Bu yapı, geçmişte gerçekleşen bir duruma rağmen başka bir olayın gerçekleştiğini anlatır.&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Embora estivesse cansada, fui trabalhar.&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Yorgun olmama rağmen işe gittim.&lt;/i&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;Embora tivesse pouco dinheiro, decidiu viajar.&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Az parası olmasına rağmen seyahat etmeye karar verdi.&lt;/i&gt;&lt;/div&gt;&lt;/section&gt;&lt;footer class=&quot;card&quot;&gt;&lt;h2&gt;✍️ Şimdi sıra sende!&lt;/h2&gt;&lt;p&gt;1–10: Portekizce cümlelerle cevapla. 11–20: Şıkları seç. Açık uçlu cevaplarını istersen bana gönder; Türkçe açıklamalarla değerlendirebilirim.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Bu panoda Kasım kontrol listesi veya günlük takip bölümü bulunmaz. Kayıtlar bu tarayıcıda tutulur.&lt;/p&gt;&lt;/footer&gt;&lt;/main&gt;&lt;script&gt;

 &quot;estivesse&quot;], 3], [&quot;Se Mariana tivesse mais tempo, ela ______ para casa para buscar os documentos.&quot;, [&quot;volta&quot;, &quot;voltou&quot;, &quot;voltaria&quot;, &quot;voltava&quot;], 2], [&quot;Mariana ficou feliz porque a recepcionista disse que ela ______ enviar os documentos mais tarde.&quot;, [&quot;poderia&quot;, &quot;pode&quot;, &quot;pôde&quot;, &quot;podendo&quot;], 0]];const key='pt_b1_2026_11_19_imprevistos';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};const save=()=&gt;{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}};openQs.forEach((q,i)=&gt;{let box=document.createElement('div');box.className='question';let title=document.createElement('strong');title.textContent=(i+1)+'. '+q;let input=document.createElement('textarea');input.placeholder='Escreva sua resposta em português...';input.value=state['q'+i]||'';input.addEventListener('input',()=&gt;{state['q'+i]=input.value;save()});box.append(title,input);document.getElementById('openqs').append(box)});let audioCtx;let soundOn=state.sound!==false;function tone(ok){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();[0,1].forEach(i=&gt;{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.12;o.type='sine';o.frequency.value=ok?660+i*180:350-i*90;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.10,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.17)})}catch(e){}}function renderScore(){let answered=0,correct=0;mc.forEach((q,i)=&gt;{let n=state['m'+i];if(n!==undefined){answered++;if(n===q[2])correct++}});document.getElementById('score').textContent=correct+'/10 doğru · '+answered+'/10 cevaplandı'}function renderMc(){['vocabqs','grammarqs'].forEach(id=&gt;document.getElementById(id).innerHTML='');mc.forEach((q,i)=&gt;{let box=docu &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main class=&quot;wrap&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;span class=&quot;tag&quot;&gt;🇧🇷 PORTUGUÊS B1 • 2. GÜN&lt;/span&gt;&lt;h1&gt;Resolvendo um problema no apartamento&lt;/h1&gt;&lt;div class=&quot;meta&quot;&gt;📅 19 Kasım 2026 · Perşembe · B1 (Orta) · ⏱️ 25–30 dakika · 📝 20 soru&lt;/div&gt;&lt;p&gt;Evde yaşanan bir sorunu çözmek&lt;/p&gt;&lt;div class=&quot;controls&quot; style=&quot;justify-content:center&quot;&gt;&lt;span class=&quot;score&quot; id=&quot;score&quot;&gt;0/10 çoktan seçmeli doğru&lt;/span&gt;&lt;button class=&quot;btn&quot; id=&quot;sound&quot;&gt;🔊 Ses açık&lt;/button&gt;&lt;/div&gt;&lt;/header&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📖 Texto — O chuveiro parou de funcionar&lt;/h2&gt;&lt;p&gt;Leia o texto com atenção. Depois, responda às perguntas.&lt;/p&gt;&lt;div class=&quot;reading&quot;&gt;Na terça-feira passada, Lucas chegou em casa depois de um dia cansativo de trabalho. Tudo o que ele queria era tomar um banho quente e descansar um pouco.

Porém, quando abriu o chuveiro, percebeu que a água estava completamente fria. Ele tentou ajustar a temperatura várias vezes, mas não conseguiu resolver o problema.

Como já era tarde, decidiu mandar uma mensagem para o proprietário do apartamento.

Lucas: Boa noite, senhor Roberto! Desculpe incomodar a esta hora, mas estou com um problema no chuveiro. A água não está esquentando.

Roberto: Boa noite, Lucas! Não se preocupe. Você já verificou se o disjuntor está ligado?

Lucas: Sim, já verifiquei. Parece que está tudo normal, mas o chuveiro continua sem funcionar.

Roberto: Entendi. Vou entrar em contato com um eletricista amanhã cedo. Você vai estar em casa durante a manhã?

Lucas: Infelizmente, não. Tenho uma reunião importante às nove horas. Será que ele poderia vir depois das duas da tarde?

Roberto: Claro! Vou tentar marcar para esse horário e aviso você assim que tiver uma confirmação.

No dia seguinte, o eletricista chegou às duas e meia. Depois de examinar o chuveiro, descobriu que uma peça estava queimada e precisava ser substituída.

O conserto levou aproximadamente quarenta minutos.

Lucas ficou aliviado porque o problema foi resolvido rapidamente. Ele agradeceu ao proprietário pela ajuda.

Apesar do transtorno, percebeu que conversar com educação e explicar a situação com clareza pode facilitar a solução de muitos problemas.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📝 Parte 1 — Compreensão de texto&lt;/h2&gt;&lt;p&gt;Okuduğunu anlama · 1–10: &lt;strong&gt;Responda em português, usando frases completas.&lt;/strong&gt;&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Açık uçlu cevapların otomatik puanlanmaz; yazdıkların cihazında saklanır.&lt;/p&gt;&lt;div id=&quot;openqs&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🔤 Parte 2 — Vocabulário&lt;/h2&gt;&lt;p&gt;Kelime bilgisi · 11–15: Escolha a alternativa correta.&lt;/p&gt;&lt;div id=&quot;vocabqs&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🧠 Parte 3 — Gramática&lt;/h2&gt;&lt;p&gt;Dil bilgisi · 16–20: Escolha a alternativa correta.&lt;/p&gt;&lt;div id=&quot;grammarqs&quot;&gt;&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;Seçtiğin şık anında kontrol edilir; sesli uyarı isteğe bağlıdır.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card daily-words-section&quot;&gt;&lt;div class=&quot;word-heading&quot;&gt;&lt;h2&gt;📚 Vocabulário do dia — Günün kelimeleri&lt;/h2&gt;&lt;button aria-label=&quot;Günün kelimelerini resim olarak paylaş&quot; class=&quot;word-share-btn&quot; title=&quot;Kelimeleri resim olarak paylaş&quot; type=&quot;button&quot;&gt;&lt;svg aria-hidden=&quot;true&quot; viewbox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 15.5V2.5m0 0L7.8 6.7M12 2.5l4.2 4.2&quot;&gt;&lt;/path&gt;&lt;path d=&quot;M8 9H6.5A3.5 3.5 0 0 0 3 12.5v7A3.5 3.5 0 0 0 6.5 23h11a3.5 3.5 0 0 0 3.5-3.5v-7A3.5 3.5 0 0 0 17.5 9H16&quot;&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;words-inner-panel&quot;&gt;&lt;table class=&quot;daily-words&quot;&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Chuveiro&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Duş başlığı / duş sistemi&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Proprietário&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Ev sahibi&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Incomodar&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Rahatsız etmek&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Disjuntor&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Elektrik sigortası / devre kesici&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Verificar&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Kontrol etmek&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Esquentar&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Isınmak / ısıtmak&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Conserto&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Tamirat&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Substituir&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Değiştirmek&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Peça&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Parça&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Aliviado&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Rahatlamış&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Transtorno&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Aksaklık / sıkıntı&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Assim que&lt;/b&gt;&lt;/td&gt;&lt;td&gt;-ir -mez&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Apesar de&lt;/b&gt;&lt;/td&gt;&lt;td&gt;-e rağmen&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Será que…?&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Acaba…?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Resolver&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Çözmek&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🎯 Bugünün dil bilgisi konusu&lt;/h2&gt;&lt;h3&gt;Embora + pretérito imperfeito do subjuntivo&lt;/h3&gt;&lt;p&gt;Embora, Türkçede “-mesine rağmen” anlamına gelir. Geçmişte pretérito imperfeito do subjuntivo ile kullanılabilir.&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Embora estivesse cansado, Lucas resolveu o problema.&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Yorgun olmasına rağmen Lucas sorunu çözdü.&lt;/i&gt;&lt;br/&gt;&lt;br/&gt;&lt;b&gt;Embora fosse tarde, ele mandou uma mensagem.&lt;/b&gt;&lt; &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main class=&quot;wrap&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;span class=&quot;tag&quot;&gt;🇧🇷 PORTUGUÊS B1 • 3. GÜN&lt;/span&gt;&lt;h1&gt;Uma compra que não saiu como esperado&lt;/h1&gt;&lt;div class=&quot;meta&quot;&gt;📅 20 Kasım 2026 · Cuma · B1 (Orta) · ⏱️ 25–30 dakika · 📝 20 soru&lt;/div&gt;&lt;p&gt;Beklendiği gibi gitmeyen bir alışveriş&lt;/p&gt;&lt;div class=&quot;controls&quot; style=&quot;justify-content:center&quot;&gt;&lt;span class=&quot;score&quot; id=&quot;score&quot;&gt;0/10 çoktan seçmeli doğru&lt;/span&gt;&lt;button class=&quot;btn&quot; id=&quot;sound&quot;&gt;🔊 Ses açık&lt;/button&gt;&lt;/div&gt;&lt;/header&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📖 Texto — O liquidificador novo&lt;/h2&gt;&lt;p&gt;Leia o texto com atenção. Depois, responda às perguntas.&lt;/p&gt;&lt;div class=&quot;reading&quot;&gt;Na semana passada, Mariana decidiu comprar um liquidificador novo porque o antigo tinha parado de funcionar.

Ela pesquisou os preços pela internet e encontrou uma promoção em uma loja perto de sua casa. Como precisava do aparelho com urgência, resolveu ir pessoalmente à loja.

Quando chegou, um vendedor explicou que o produto estava com 20% de desconto. Mariana ficou satisfeita e comprou o liquidificador.

No entanto, ao chegar em casa e tentar usá-lo, percebeu que o aparelho fazia um barulho estranho e desligava sozinho depois de alguns segundos.

No dia seguinte, Mariana voltou à loja com o produto e a nota fiscal.

— Bom dia! Comprei este liquidificador ontem, mas ele não está funcionando direito.

— Sinto muito pelo problema, senhora. A senhora gostaria de trocar o produto ou receber o dinheiro de volta? — perguntou o atendente.

— Prefiro trocar, porque realmente preciso de um liquidificador.

O atendente verificou o aparelho e confirmou que havia um defeito. Como o mesmo modelo estava esgotado, ofereceu outro um pouco mais caro, sem cobrar a diferença.

Mariana aceitou a proposta e saiu satisfeita.

Apesar do problema inicial, ela ficou contente com o atendimento e decidiu que voltaria àquela loja no futuro.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📝 Parte 1 — Compreensão de texto&lt;/h2&gt;&lt;p&gt;Okuduğunu anlama · 1–10: &lt;strong&gt;Responda em português, usando frases completas.&lt;/strong&gt;&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Açık uçlu cevapların otomatik puanlanmaz; yazdıkların cihazında saklanır.&lt;/p&gt;&lt;div id=&quot;openqs&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🔤 Parte 2 — Vocabulário&lt;/h2&gt;&lt;p&gt;Kelime bilgisi · 11–15: Escolha a alternativa correta.&lt;/p&gt;&lt;div id=&quot;vocabqs&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🧠 Parte 3 — Gramática&lt;/h2&gt;&lt;p&gt;Dil bilgisi · 16–20: Escolha a alternativa correta.&lt;/p&gt;&lt;div id=&quot;grammarqs&quot;&gt;&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;Seçtiğin şık anında kontrol edilir; sesli uyarı isteğe bağlıdır.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card daily-words-section&quot;&gt;&lt;div class=&quot;word-heading&quot;&gt;&lt;h2&gt;📚 Vocabulário do dia — Günün kelimeleri&lt;/h2&gt;&lt;button aria-label=&quot;Günün kelimelerini resim olarak paylaş&quot; class=&quot;word-share-btn&quot; title=&quot;Kelimeleri resim olarak paylaş&quot; type=&quot;button&quot;&gt;&lt;svg aria-hidden=&quot;true&quot; viewbox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 15.5V2.5m0 0L7.8 6.7M12 2.5l4.2 4.2&quot;&gt;&lt;/path&gt;&lt;path d=&quot;M8 9H6.5A3.5 3.5 0 0 0 3 12.5v7A3.5 3.5 0 0 0 6.5 23h11a3.5 3.5 0 0 0 3.5-3.5v-7A3.5 3.5 0 0 0 17.5 9H16&quot;&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;words-inner-panel&quot;&gt;&lt;table class=&quot;daily-words&quot;&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Promoção&lt;/b&gt;&lt;/td&gt;&lt;td&gt;İndirim kampanyası&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Desconto&lt;/b&gt;&lt;/td&gt;&lt;td direito.&lt;/b&gt;&lt;br/&gt;Cihaz düzgün çalışmıyor.&lt;br/&gt;&lt;br/&gt;&lt;b&gt;Tem como receber meu dinheiro de volta?&lt;/b&gt;&lt;br/&gt;Paramı geri almam mümkün mü?&lt;br/&gt;&lt;br/&gt;&lt;/div&gt;&lt;/section&gt;&lt;footer class=&quot;card&quot;&gt;&lt;h2&gt;✍️ Şimdi sıra sende!&lt;/h2&gt;&lt;p&gt;1–10: Portekizce cümlelerle cevapla. 11–20: Şıkları seç. Açık uçlu cevaplarını istersen bana gönder; Türkçe açıklamalarla değerlendirebilirim.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Bu panoda Kasım kontrol listesi veya günlük takip bölümü bulunmaz. Kayıtlar bu tarayıcıda tutulur.&lt;/p&gt;&lt;/footer&gt;&lt;/main&gt;&lt;script&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main class=&quot;wrap&quot;&gt;&lt;header class=&quot;hero&quot;&gt;&lt;span class=&quot;tag&quot;&gt;🇧🇷 PORTUGUÊS B1 • 4. GÜN&lt;/span&gt;&lt;h1&gt;Uma encomenda que não chegou&lt;/h1&gt;&lt;div class=&quot;meta&quot;&gt;📅 21 Kasım 2026 · Cumartesi · B1 (Orta) · ⏱️ 25–30 dakika · 📝 20 soru&lt;/div&gt;&lt;p&gt;Teslim edilmeyen bir kargo&lt;/p&gt;&lt;div class=&quot;controls&quot; style=&quot;justify-content:center&quot;&gt;&lt;span class=&quot;score&quot; id=&quot;score&quot;&gt;0/20 cevaplandı&lt;/span&gt;&lt;button class=&quot;btn&quot; id=&quot;sound&quot;&gt;🔊 Ses açık&lt;/button&gt;&lt;/div&gt;&lt;/header&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📖 Texto — O pacote de Mariana&lt;/h2&gt;&lt;p&gt;Leia o texto com atenção. Depois, responda às perguntas.&lt;/p&gt;&lt;div class=&quot;reading&quot;&gt;Na semana passada, Mariana comprou uma cafeteira pela internet. Como a antiga havia parado de funcionar, ela precisava receber o produto o mais rápido possível.

No momento da compra, o site informou que a entrega seria realizada em até três dias úteis. Mariana ficou satisfeita, pois esperava preparar café para alguns amigos no sábado.

Entretanto, na sexta-feira à tarde, ela percebeu que o pedido ainda não havia chegado. Ao consultar o aplicativo da transportadora, encontrou a seguinte mensagem: “Tentativa de entrega realizada. Destinatário ausente.”

Mariana ficou surpresa porque havia passado o dia inteiro em casa. Além disso, ninguém tinha tocado a campainha.

Ela decidiu entrar em contato com o atendimento ao cliente.

— Boa tarde! Gostaria de saber o que aconteceu com a minha encomenda. O aplicativo informa que não havia ninguém em casa, mas isso não é verdade.

A atendente pediu o número do pedido e verificou a situação.

— Peço desculpas pelo transtorno. Parece que houve um erro no registro da entrega. Podemos agendar uma nova tentativa para amanhã.

— Tudo bem, mas vocês poderiam confirmar o horário aproximado? Preciso sair durante a manhã.

— Infelizmente, não conseguimos garantir um horário específico. Porém, podemos solicitar que o entregador ligue antes de chegar.

Mariana concordou com a proposta.

No sábado, por volta das duas da tarde, o entregador telefonou avisando que chegaria em quinze minutos. Dessa vez, a entrega aconteceu sem problemas.

Embora tivesse ficado irritada com o atraso, Mariana ficou satisfeita com a solução.

Ela percebeu que explicar o problema com calma e clareza ajudou a resolver a situação mais rapidamente.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📝 Parte 1 — Compreensão de texto&lt;/h2&gt;&lt;p&gt;Okuduğunu anlama · 1–8: Escolha a alternativa correta.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Sorulara ve şıklara basılı tutarak Türkçe anlamlarını görebilirsin.&lt;/p&gt;&lt;div id=&quot;comprehensionqs&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🔤 Parte 2 — Vocabulário&lt;/h2&gt;&lt;p&gt;Kelime bilgisi · 9–14: Escolha a alternativa correta.&lt;/p&gt;&lt;div id=&quot;vocabqs&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🧠 Parte 3 — Gramática&lt;/h2&gt;&lt;p&gt;Dil bilgisi · 15–20: Escolha a alternativa correta.&lt;/p&gt;&lt;div id=&quot;grammarqs&quot;&gt;&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;Cevap anahtarı başlangıçta gizlidir. Bitirince “Cevaplarımı kontrol et” butonuna bas.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card daily-words-section&quot;&gt;&lt;div class=&quot;word-heading&quot;&gt;&lt;h2&gt;📚 Vocabulário do dia — Günün kelimeleri&lt;/h2&gt;&lt;button aria-label=&quot;Günün kelimelerini resim olarak paylaş&quot; class=&quot;word-share-btn&quot; title=&quot;Kelimeleri resim olarak paylaş&quot; type=&quot;button&quot;&gt;&lt;svg aria-hidden=&quot;true&quot; viewbox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M12 15.5V2.5m0 0L7.8 6.7M12 2.5l4.2 4.2&quot;&gt;&lt;/path&gt;&lt;path d=&quot;M8 9H6.5A3.5 3.5 0 0 0 3 12.5v7A3.5 3.5 0 0 0 6.5 23h11a3.5 3.5 0 0 0 3.5-3.5v-7A3.5 3.5 0 0 0 17.5 9H16&quot;&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;words-inner-panel&quot;&gt;&lt;table class=&quot;daily-words&quot;&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Encomenda&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Kargo / sipariş&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Prazo de entrega&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Teslimat süresi&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Dias úteis&lt;/b&gt;&lt;/td&gt;&lt;td&gt;İş günleri&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Transportadora&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Kargo şirketi&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Destinatário ausente&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Alıcı adreste yok&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Campainha&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Kapı zili&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Atendimento ao cliente&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Müşteri hizmetleri&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Transtorno&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Aksaklık / sıkıntı&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Agendar&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Planlamak / randevu ayarlamak&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Entregador&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Kurye / teslimat görevlisi&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Atraso&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Gecikme&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Com calma e clareza&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Sakin ve açık bir şekilde&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🎯 Bugünün dil bilgisi konusu&lt;/h2&gt;&lt;h3&gt;Futuro do subjuntivo&lt;/h3&gt;&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Se eu receber o pacote amanhã, avisarei você.&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Paketi yarın alırsam sana haber vereceğim.&lt;/i&gt;&lt;/div&gt;&lt;h3&gt;Embora + subjuntivo&lt;/h3&gt;&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Embora Mariana estivesse irritada, ela conversou com calma.&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Mariana sinirli olmasına rağmen sakin konuştu.&lt;/i&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;💬 Expressões úteis — Günlük ifadeler&lt;/h2&gt;&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Gostaria de saber o que aconteceu.&lt;/b&gt;&lt;br/&gt;&lt;i&gt;Ne olduğunu öğrenmek istiyorum.&lt;/i&gt;&lt;br/&gt;&lt
