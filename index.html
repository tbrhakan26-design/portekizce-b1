Depois de tomar café da manhã, Mariana saiu de casa às sete e meia. Normalmente, ela leva cerca de quarenta minutos para chegar ao centro da cidade. No entanto, naquele dia, o trânsito estava muito pior do que o habitual.

Enquanto estava no ônibus, Mariana percebeu que tinha esquecido alguns documentos importantes em casa. Por um momento, pensou em voltar, mas decidiu continuar o caminho.

Assim que chegou à empresa, explicou a situação à recepcionista. Felizmente, a funcionária foi muito compreensiva e disse que Mariana poderia enviar os documentos por e-mail mais tarde.

A entrevista durou aproximadamente uma hora. Embora estivesse nervosa no início, Mariana conseguiu responder a todas as perguntas com confiança.

Quando saiu da empresa, recebeu uma mensagem de uma amiga convidando-a para almoçar.

Mariana aceitou o convite porque precisava relaxar depois de uma manhã tão agitada.

No final do dia, percebeu que nem tudo acontece como planejamos, mas isso não significa que as coisas vão dar errado.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📝 Parte 1 — Compreensão de texto&lt;/h2&gt;&lt;p&gt;Okuduğunu anlama · 1–10: &lt;strong&gt;Responda em português, usando frases completas.&lt;/strong&gt;&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Açık uçlu cevapların otomatik puanlanmaz; yazdıkların cihazında saklanır.&lt;/p&gt;&lt;div id=&quot;openqs&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🔤 Parte 2 — Vocabulário&lt;/h2&gt;&lt;p&gt;Kelime bilgisi · 11–15: Escolha a alternativa correta.&lt;/p&gt;&lt;div id=&quot;vocabqs&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🧠 Parte 3 — Gramática&lt;/h2&gt;&lt;p&gt;Dil bilgisi · 16–20: Escolha a alternativa correta.&lt;/p&gt;&lt;div id=&quot;grammarqs&quot;&gt;&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;Seçtiğin şık anında kontrol edilir; sesli uyarı isteğe bağlıdır.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📚 Vocabulário do dia — Günün kelimeleri&lt;/h2&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Imprevisto&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Beklenmedik olay&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;De costume&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Her zamanki gibi&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Oportunidade&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Fırsat&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;No entanto&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Ancak, bununla birlikte&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Perceber&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Fark etmek&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Embora&lt;/b&gt;&lt;/td&gt;&lt;td&gt;-mesine rağmen&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Compreensivo(a)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Anlayışlı&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Confiança&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Özgüven&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Assim que&lt;/b&gt;&lt;/td&gt;&lt;td&gt;-ir -mez&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Agitado(a)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Yoğun, hareketli&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Conseguir&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Başarmak&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Dar errado&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Ters gitmek&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🎯 Bugünün dil bilgisi konusu&lt;/h2&gt;&lt;h3&gt;Embora + pretérito imperfeito do subjuntivo&lt;/h3&gt;&lt;p&gt;Bu yapı, geçmişte gerçekleşen bir duruma rağmen başka bir olayın gerçekleştiğini anlatır.&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Embora estivesse cansada, fui trabalhar.&lt;/b&gt;&lt;br&gt;&lt;i&gt;Yorgun olmama rağmen işe gittim.&lt;/i&gt;&lt;br&gt;&lt;br&gt;&lt;b&gt;Embora tivesse pouco dinheiro, decidiu viajar.&lt;/b&gt;&lt;br&gt;&lt;i&gt;Az parası olmasına rağmen seyahat etmeye karar verdi.&lt;/i&gt;&lt;/div&gt;&lt;/section&gt;&lt;footer class=&quot;card&quot;&gt;&lt;h2&gt;✍️ Şimdi sıra sende!&lt;/h2&gt;&lt;p&gt;1–10: Portekizce cümlelerle cevapla. 11–20: Şıkları seç. Açık uçlu cevaplarını istersen bana gönder; Türkçe açıklamalarla değerlendirebilirim.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Bu panoda Kasım kontrol listesi veya günlük takip bölümü bulunmaz. Kayıtlar bu tarayıcıda tutulur.&lt;/p&gt;&lt;/footer&gt;&lt;/main&gt;&lt;script&gt;

Porém, quando abriu o chuveiro, percebeu que a água estava completamente fria. Ele tentou ajustar a temperatura várias vezes, mas não conseguiu resolver o problema.

Como já era tarde, decidiu mandar uma mensagem para o proprietário do apartamento.

Lucas: Boa noite, senhor Roberto! Desculpe incomodar a esta hora, mas estou com um problema no chuveiro. A água não está esquentando.

Roberto: Boa noite, Lucas! Não se preocupe. Você já verificou se o disjuntor está ligado?

Lucas: Sim, já verifiquei. Parece que está tudo normal, mas o chuveiro continua sem funcionar.

Roberto: Entendi. Vou entrar em contato com um eletricista amanhã cedo. Você vai estar em casa durante a manhã?

Lucas: Infelizmente, não. Tenho uma reunião importante às nove horas. Será que ele poderia vir depois das duas da tarde?

Roberto: Claro! Vou tentar marcar para esse horário e aviso você assim que tiver uma confirmação.

No dia seguinte, o eletricista chegou às duas e meia. Depois de examinar o chuveiro, descobriu que uma peça estava queimada e precisava ser substituída.

O conserto levou aproximadamente quarenta minutos.

Lucas ficou aliviado porque o problema foi resolvido rapidamente. Ele agradeceu ao proprietário pela ajuda.

Apesar do transtorno, percebeu que conversar com educação e explicar a situação com clareza pode facilitar a solução de muitos problemas.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📝 Parte 1 — Compreensão de texto&lt;/h2&gt;&lt;p&gt;Okuduğunu anlama · 1–10: &lt;strong&gt;Responda em português, usando frases completas.&lt;/strong&gt;&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Açık uçlu cevapların otomatik puanlanmaz; yazdıkların cihazında saklanır.&lt;/p&gt;&lt;div id=&quot;openqs&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🔤 Parte 2 — Vocabulário&lt;/h2&gt;&lt;p&gt;Kelime bilgisi · 11–15: Escolha a alternativa correta.&lt;/p&gt;&lt;div id=&quot;vocabqs&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🧠 Parte 3 — Gramática&lt;/h2&gt;&lt;p&gt;Dil bilgisi · 16–20: Escolha a alternativa correta.&lt;/p&gt;&lt;div id=&quot;grammarqs&quot;&gt;&lt;/div&gt;&lt;p class=&quot;muted&quot;&gt;Seçtiğin şık anında kontrol edilir; sesli uyarı isteğe bağlıdır.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;📚 Vocabulário do dia — Günün kelimeleri&lt;/h2&gt;&lt;table&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Chuveiro&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Duş başlığı / duş sistemi&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Proprietário&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Ev sahibi&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Incomodar&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Rahatsız etmek&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Disjuntor&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Elektrik sigortası / devre kesici&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Verificar&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Kontrol etmek&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Esquentar&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Isınmak / ısıtmak&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Conserto&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Tamirat&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Substituir&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Değiştirmek&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Peça&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Parça&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Aliviado&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Rahatlamış&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Transtorno&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Aksaklık / sıkıntı&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Assim que&lt;/b&gt;&lt;/td&gt;&lt;td&gt;-ir -mez&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Apesar de&lt;/b&gt;&lt;/td&gt;&lt;td&gt;-e rağmen&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Será que…?&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Acaba…?&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;b&gt;Resolver&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Çözmek&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;🎯 Bugünün dil bilgisi konusu&lt;/h2&gt;&lt;h3&gt;Embora + pretérito imperfeito do subjuntivo&lt;/h3&gt;&lt;p&gt;Embora, Türkçede “-mesine rağmen” anlamına gelir. Geçmişte pretérito imperfeito do subjuntivo ile kullanılabilir.&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Embora estivesse cansado, Lucas resolveu o problema.&lt;/b&gt;&lt;br&gt;&lt;i&gt;Yorgun olmasına rağmen Lucas sorunu çözdü.&lt;/i&gt;&lt;br&gt;&lt;br&gt;&lt;b&gt;Embora fosse tarde, ele mandou uma mensagem.&lt;/b&gt;&lt;br&gt;&lt;i&gt;Geç olmasına rağmen mesaj gönderdi.&lt;/i&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;Embora não tivesse muito tempo, decidiu ajudar.&lt;/b&gt;&lt;br&gt;&lt;i&gt;Çok fazla zamanı olmasına rağmen değil; çok fazla zamanı olmamasına rağmen yardım etmeye karar verdi.&lt;/i&gt;&lt;/p&gt;&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Apesar de estar cansado, ele saiu.&lt;/b&gt;&lt;br&gt;&lt;i&gt;Yorgun olmasına rağmen dışarı çıktı.&lt;/i&gt;&lt;br&gt;&lt;br&gt;&lt;b&gt;Embora estivesse cansado, ele saiu.&lt;/b&gt;&lt;br&gt;&lt;i&gt;Yorgun olmasına rağmen dışarı çıktı.&lt;/i&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;card&quot;&gt;&lt;h2&gt;💬 Expressões úteis — Günlük ifadeler&lt;/h2&gt;&lt;div class=&quot;note&quot;&gt;&lt;b&gt;Estou com um problema no chuveiro.&lt;/b&gt;&lt;br&gt;Duş sisteminde bir sorun yaşıyorum.&lt;br&gt;&lt;br&gt;&lt;b&gt;Será que você poderia me ajudar?&lt;/b&gt;&lt;br&gt;Acaba bana yardımcı olabilir misiniz?&lt;br&gt;&lt;br&gt;&lt;b&gt;Já tentei resolver, mas não consegui.&lt;/b&gt;&lt;br&gt;Çözmeye çalıştım ama başaramadım.&lt;br&gt;&lt;br&gt;&lt;b&gt;Você poderia vir depois das duas?&lt;/b&gt;&lt;br&gt;Saat ikiden sonra gelebilir misiniz?&lt;br&gt;&lt;br&gt;&lt;b&gt;Muito obrigado pela ajuda!&lt;/b&gt;&lt;br&gt;Yardımınız için çok teşekkür ederim!&lt;/div&gt;&lt;/section&gt;&lt;footer class=&quot;card&quot;&gt;&lt;h2&gt;✍️ Şimdi sıra sende!&lt;/h2&gt;&lt;p&gt;1–10: Portekizce cümlelerle cevapla. 11–20: Şıkları seç. Açık uçlu cevaplarını istersen bana gönder; Türkçe açıklamalarla değerlendirebilirim.&lt;/p&gt;&lt;p class=&quot;muted&quot;&gt;Bu panoda Kasım kontrol listesi veya günlük takip bölümü bulunmaz. Kayıtlar bu tarayıcıda tutulur.&lt;/p&gt;&lt;/footer&gt;&lt;/main&gt;&lt;script&gt;
const openQs=[&quot;O que Lucas queria fazer quando chegou em casa?&quot;, &quot;Qual foi o problema que Lucas encontrou no apartamento?&quot;, &quot;O que ele tentou fazer antes de entrar em contato com o proprietário?&quot;, &quot;Por que Lucas decidiu mandar uma mensagem em vez de telefonar?&quot;, &quot;Qual foi a primeira pergunta que Roberto fez a Lucas?&quot;, &quot;Por que Lucas não poderia receber o eletricista pela manhã?&quot;, &quot;Para que horário Lucas pediu que a visita fosse marcada?&quot;, &quot;O que o eletricista descobriu depois de examinar o chuveiro?&quot;, &quot;Quanto tempo demorou o conserto?&quot;, &quot;Qual foi a principal lição que Lucas aprendeu com essa situação?&quot;],mc=[[&quot;O que significa a expressão “entrar em contato”?&quot;, [&quot;Entrar em uma casa&quot;, &quot;Comunicar-se com alguém&quot;, &quot;Encontrar um objeto&quot;, &quot;Sair de um lugar&quot;], 1], [&quot;Na frase “Uma peça estava queimada”, a palavra “peça” significa:&quot;, [&quot;Uma parte de um equipamento&quot;, &quot;Uma roupa nova&quot;, &quot;Um documento&quot;, &quot;Uma ferramenta de limpeza&quot;], 0], [&quot;Qual é o significado de “assim que”?&quot;, [&quot;Apesar de&quot;, &quot;Antes que&quot;, &quot;Logo que&quot;, &quot;Mesmo que&quot;], 2], [&quot;A palavra “aliviado” indica que Lucas estava:&quot;, [&quot;Mais preocupado&quot;, &quot;Menos preocupado&quot;, &quot;Muito irritado&quot;, &quot;Com bastante sono&quot;], 1], [&quot;Qual expressão pode substituir “Será que ele poderia vir…” mantendo o sentido educado?&quot;, [&quot;Ele tem que vir!&quot;, &quot;Ele veio ontem?&quot;, &quot;Seria possível ele vir…?&quot;, &quot;Ele nunca vem!&quot;], 2], [&quot;Ontem, Lucas ______ uma mensagem para o proprietário.&quot;, [&quot;manda&quot;, &quot;mandou&quot;, &quot;mandava&quot;, &quot;mandará&quot;], 1], [&quot;Quando o eletricista chegou, Lucas já ______ o problema ao proprietário.&quot;, [&quot;explicou&quot;, &quot;explicava&quot;, &quot;tinha explicado&quot;, &quot;explicará&quot;], 2], [&quot;Se o chuveiro funcionasse normalmente, Lucas não ______ chamar um eletricista.&quot;, [&quot;precisaria&quot;, &quot;precisa&quot;, &quot;precisou&quot;, &quot;precisará&quot;], 0], [&quot;Roberto disse que ______ entrar em contato com um eletricista no dia seguinte.&quot;, [&quot;vai&quot;, &quot;iria&quot;, &quot;foi&quot;, &quot;indo&quot;], 1], [&quot;Embora o problema ______ complicado, o eletricista conseguiu resolvê-lo rapidamente.&quot;, [&quot;parecia&quot;, &quot;parece&quot;, &quot;parecesse&quot;, &quot;parecerá&quot;], 2]];const key='pt_b1_2026_11_19_chuveiro_day2';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};const save=()=&gt;{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}};openQs.forEach((q,i)=&gt;{let box=document.createElement('div');box.className='question';let title=document.createElement('strong');title.textContent=(i+1)+'. '+q;let input=document.createElement('textarea');input.placeholder='Escreva sua resposta em português...';input.value=state['q'+i]||'';input.addEventListener('input',()=&gt;{state['q'+i]=input.value;save()});box.append(title,input);document.getElementById('openqs').append(box)});let audioCtx;let soundOn=state.sound!==false;function tone(ok){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();[0,1].forEach(i=&gt;{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.12;o.type='sine';o.frequency.value=ok?660+i*180:350-i*90;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.10,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.17)})}catch(e){}}function renderScore(){let answered=0,correct=0;mc.forEach((q,i)=&gt;{let n=state['m'+i];if(n!==undefined){answered++;if(n===q[2])correct++}});document.getElementById('score').textContent=correct+'/10 doğru · '+answered+'/10 cevaplandı'}function renderMc(){['vocabqs','grammarqs'].forEach(id=&gt;document.getElementById(id).innerHTML='');mc.forEach((q,i)=&gt;{let box=document.createElement('div');box.className='question';let title=document.createElement('strong');title.textContent=(i+11)+'. '+q[0];box.append(title);let grid=document.createElement('div');grid.className='options';q[1].forEach((opt,j)=&gt;{let b=document.createElement('button');b.className='option';let chosen=state['m'+i];if(chosen===j)b.classList.add('selected',chosen===q[2]?'correct':'wrong');b.textContent=String.fromCharCode(65+j)+') '+opt;b.onclick=()=&gt;{state['m'+i]=j;save();tone(j===q[2]);renderMc();renderScore()};grid.append(b)});box.append(grid);let chosen=state['m'+i];if(chosen!==undefined){let fb=document.createElement('div');fb.className='feedback';fb.style.color=chosen===q[2]?'#27734e':'#b04439';fb.textContent=chosen===q[2]?'✓ Correto!':'✕ Incorreto. Resposta correta: '+String.fromCharCode(65+q[2]);box.append(fb)}document.getElementById(i&lt;5?'vocabqs':'grammarqs').append(box)})}document.getElementById('sound').onclick=()=&gt;{soundOn=!soundOn;state.sound=soundOn;save();setSound()};function setSound(){document.getElementById('sound').textContent=soundOn?'🔊 Ses açık':'🔇 Ses kapalı'}setSound();renderMc();renderScore();
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;" title="İkinci gün"></iframe><script>let currentDay=0;function show(i){currentDay=Math.max(0,Math.min(1,i));document.querySelectorAll('.lesson').forEach((x,j)=>x.classList.toggle('active',currentDay===j));document.getElementById('currentDate').textContent=currentDay===0?'18.11.2026':'19.11.2026';document.querySelector('.prev').disabled=currentDay===0;document.querySelector('.next').disabled=currentDay===1;}function changeDay(step){show(currentDay+step)}show(0);</script></body></html>
