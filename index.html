const lessonDates=['2026-11-18','2026-11-19','2026-11-20','2026-11-21','2026-11-22','2026-11-23'];
const lessonData=JSON.parse(document.getElementById('lessonData').textContent);
const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
const dateParts=Object.fromEntries(parts.map(p=>[p.type,p.value]));
const today=`${dateParts.year}-${dateParts.month}-${dateParts.day}`;
let currentDay=lessonDates.indexOf(today);
if(currentDay<0)currentDay=lessonDates.length-1;
function decodeUtf8(b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function showDay(i){
 currentDay=Math.max(0,Math.min(lessonDates.length-1,i));
 const date=lessonDates[currentDay];
 document.getElementById('currentDate').textContent=date.split('-').reverse().join('.')+(date===today?' · Bugün':'');
 document.querySelector('.prev').disabled=currentDay===0;
 document.querySelector('.next').disabled=currentDay===lessonDates.length-1;
 const frame=document.getElementById('lessonFrame');
 frame.srcdoc=decodeUtf8(lessonData[currentDay]);
 window.scrollTo({top:0,behavior:'instant'});
}
function changeDay(delta){showDay(currentDay+delta)}
showDay(currentDay);
