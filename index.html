const lessonDates=['2026-11-18','2026-11-19','2026-11-20','2026-11-21','2026-11-22','2026-11-23','2026-11-24'];
const lessonData=JSON.parse(document.getElementById('lessonData').textContent);
const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
const dateParts=Object.fromEntries(parts.map(p=>[p.type,p.value]));
const today=`${dateParts.year}-${dateParts.month}-${dateParts.day}`;
let currentDay=lessonDates.indexOf(today);
if(currentDay<0)currentDay=lessonDates.length-1;
function decodeUtf8(b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function showDay(i){
 currentDay=Math.max(0,Math.min(lessonDates.length-1,i));
 const date=lessonDates[currentDay];
 document.getElementById('currentDate').textContent=date.split('-').reverse().join('.')+(date===today?' · Bugün':'');
 document.querySelector('.prev').disabled=currentDay===0;
 document.querySelector('.next').disabled=currentDay===lessonDates.length-1;
 const frame=document.getElementById('lessonFrame');
 frame.srcdoc=decodeUtf8(lessonData[currentDay]);
 window.scrollTo({top:0,behavior:'instant'});
}
function changeDay(delta){showDay(currentDay+delta)}
showDay(currentDay);

function archiveData(){try{return JSON.parse(localStorage.getItem('ptSavedWords')||'{}')||{}}catch(e){return {}}}
function refreshArchive(){const data=archiveData(),entries=Object.entries(data);document.getElementById('archiveCount').textContent=entries.length+' kelime';const rows=document.getElementById('archiveRows');rows.replaceChildren();if(!entries.length)rows.textContent='Henüz kelime kaydetmedin.';for(const [word,a] of entries){const row=document.createElement('article'),title=document.createElement('strong');title.textContent=word+' — '+a[0];row.append(title);for(let i=1;i<a.length;i++){const line=document.createElement('div');line.className=i%2?'pt':'tr';line.textContent=a[i];row.append(line)}const del=document.createElement('button');del.textContent='Sil';del.onclick=()=>{const latest=archiveData();delete latest[word];try{localStorage.setItem('ptSavedWords',JSON.stringify(latest));refreshArchive();showDay(currentDay)}catch(e){document.getElementById('archiveStatus').textContent='Kayıt silinemedi.'}};row.append(del);rows.append(row)}}
function openArchive(){refreshArchive();document.getElementById('archivePanel').showModal()}
function archiveText(){return Object.entries(archiveData()).map(([w,a])=>w+' — '+a[0]+'\n'+a.slice(1).join('\n')).join('\n\n')}
function downloadArchive(){const t=archiveText();if(!t)return;const u=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='kelime-arsivim.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function shareArchive(){const t=archiveText(),status=document.getElementById('archiveStatus');if(!t){status.textContent='Henüz kelime yok.';return}try{if(navigator.share){await navigator.share({title:'Kelime Arşivim',text:t});return}if(navigator.clipboard){await navigator.clipboard.writeText(t);status.textContent='Liste kopyalandı. İstediğin uygulamaya yapıştırabilirsin.';return}}catch(e){if(e.name==='AbortError')return}downloadArchive();status.textContent='Liste TXT olarak indirildi.'}
window.addEventListener('storage',refreshArchive);window.addEventListener('focus',refreshArchive);document.getElementById('lessonFrame').addEventListener('load',refreshArchive);refreshArchive();
</script></body></html>
